# ============================================================
# 全栈编排：Meilisearch + FastAPI 后端 + Nginx 前端
# 一条 `docker compose up -d` 启动全部服务。
# 三者在同一 docker 网络，前端用服务名 backend:8000 反代，无需经宿主机。
# MySQL 由宿主机提供（宝塔/系统服务），后端通过 host.docker.internal 连接。
# ============================================================
services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: quotation-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # meili 镜像基于 distroless，没有 wget/curl/sh；用自身二进制做存活探测
      test: ["CMD", "/bin/meilisearch", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quotation-net

  backend:
    image: ai-inquiry-backend:latest
    container_name: quotation-backend
    restart: unless-stopped
    # 让容器内的 host.docker.internal 指向宿主机（连宝塔的 MySQL 用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.5-plus}
      DASHSCOPE_LITE_MODEL: ${DASHSCOPE_LITE_MODEL:-qwen-turbo}
      # 前端可选模型白名单（逗号分隔）。留空则只用上面两个模型
      DASHSCOPE_MODELS: ${DASHSCOPE_MODELS:-}
      # 默认 host.docker.internal 即"宿主机"。也可以在 .env 里覆盖为内网/公网 IP
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # 连接池（可按 MySQL max_connections 调整）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      # uvicorn worker 数（2 核 2G 建议 1~2）
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      # CORS 白名单（多个用英文逗号分隔，例：https://web.example.com,https://admin.example.com）
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      meilisearch:
        condition: service_healthy
    ports:
      # 对外发布（服务器防火墙/安全组负责拦截公网访问）
      - "${BACKEND_PORT:-8090}:8000"
    networks:
      - quotation-net

  frontend:
    image: ai-inquiry-frontend:latest
    container_name: quotation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 对外端口（宝塔反代到这里）
      - "${WEB_PORT:-3010}:80"
    networks:
      - quotation-net

volumes:
  meili_data:

networks:
  quotation-net:
    driver: bridge
